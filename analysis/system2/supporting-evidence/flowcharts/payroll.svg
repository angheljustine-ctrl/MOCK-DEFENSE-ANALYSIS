334b">Select month + Run</text><polygon points="300.0,166 395,207.0 300.0,248 205,207.0" fill="#fff2d8" stroke="#256786" stroke-width="2"/><text x="300.0" y="204.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">Month value</text><text x="300.0" y="220.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">nonempty?</text><rect x="470" y="185" width="180" height="45" rx="22.5" fill="#eef6fa" stroke="#256786" stroke-width="2"/><text x="560.0" y="212.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">No action</text><rect x="160" y="285" width="280" height="50" rx="2" fill="#eef6fa" stroke="#256786" stroke-width="2"/><text x="300.0" y="315.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">Keep payroll from other months</text><path d="M5,398 A115.0,10 0 0 1 235,398 V443 A115.0,10 0 0 1 5,443 Z" fill="#eef6fa" stroke="#256786" stroke-width="2"/><ellipse cx="120.0" cy="398" rx="115.0" ry="10" fill="#eef6fa" stroke="#256786" stroke-width="2"/><text x="120.0" y="422.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">Read active employees,</text><text x="120.0" y="438.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">attendance, approved leave</text><rect x="340" y="392" width="300" height="62" rx="2" fill="#eef6fa" stroke="#256786" stroke-width="2"/><text x="490.0" y="420.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">calc(): weekdays + absences,</text><text x="490.0" y="436.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">gross, deductions, net</text><path d="M185,515 A115.0,10 0 0 1 415,515 V560 A115.0,10 0 0 1 185,560 Z" fill="#eef6fa" stroke="#256786" stroke-width="2"/><ellipse cx="300.0" cy="515" rx="115.0" ry="10" fill="#eef6fa" stroke="#256786" stroke-width="2"/><text x="300.0" y="539.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#17334b">Replace selected month<