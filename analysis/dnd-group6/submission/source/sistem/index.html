<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doughnut Disturb | Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="loginTitle">
            <div class="auth-logo">
                <img src="img/logo.png" alt="Doughnut Disturb logo">
            </div>
            <span class="eyebrow">SECURE ADMIN PORTAL</span>
            <h1 id="loginTitle">User Login</h1>
            <p class="auth-subtitle">Sign in to access the branch management system.</p>

            <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="loginUsername">Username or Email</label>
                    <div class="input-wrap">
                        <span class="input-icon" data-icon="user"></span>
                        <input id="loginUsername" type="text" autocomplete="username" placeholder="Enter username or email">
                    </div>
                    <small id="loginUsernameError" class="field-error"></small>
                </div>

                <div class="field">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" data-icon="lock"></span>
                        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
                        <button class="icon-button password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">
                            <span data-icon="eye"></span>
                        </button>
                    </div>
                    <small id="loginPasswordError" class="field-error"></small>
                </div>

                <div class="form-options">
                    <label class="check-label">
                        <input id="rememberLogin" type="checkbox">
                        <span class="custom-check">✓</span>
                        <span>Remember me</span>
                    </label>
                    <button class="text-button" id="forgotPasswordBtn" type="button">Forgot password?</button>
                </div>

                <button class="primary-button wide" id="loginButton" type="submit">
                    <span class="button-label">Login</span>
                    <span class="button-arrow">→</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="security-note">
                <span>◆</span>
                <span>Authorized system accounts only</span>
                <span>◆</span>
            </div>
        </section>
    </main>

    <div id="forgotModal" class="modal" aria-hidden="true"></div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
