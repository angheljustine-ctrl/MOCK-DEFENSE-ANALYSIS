<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#496175"/></marker><style>.t{font:15px 'Segoe UI',Arial;fill:#172033}.p{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.d{fill:#fff8df;stroke:#c58b0b;stroke-width:2}.bad{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.db{fill:#edf7ef;stroke:#1d7a46;stroke-width:2}.term{fill:#0b3654;stroke:#0b3654;stroke-width:2}.tw{font:15px 'Segoe UI',Arial;fill:white;font-weight:700}.ln{stroke:#496175;stroke-width:2;fill:none;marker-end:url(#a)}.lbl{font:12px 'Segoe UI',Arial;fill:#5b6475;font-weight:700}</style></defs>
  <rect x="80" y="20" width="240" height="50" rx="25" class="term"/><text x="200" y="51" text-anchor="middle" class="tw">Open protected page</text>
  <path d="M200 70V100" class="ln"/><polygon points="200,105 330,155 200,205 70,155" class="d"/><text x="200" y="160" text-anchor="middle" class="t">Local session exists?</text>
  <path d="M330 155H430" class="ln"/><text x="365" y="144" class="lbl">Yes</text><rect x="435" y="127" width="250" height="56" rx="5" class="bad"/><text x="560" y="151" text-anchor="middle" class="t"><tspan x="560">Allow every module</tspan><tspan x="560" dy="19">without role check</tspan></text>
  <path d="M200 205V245" class="ln"/><text x="212" y="232" class="lbl">No</text><polygon points="90,250 330,250 310,306 70,306" class="p"/><text x="200" y="283" text-anchor="middle" class="t">Redirect to login</text>
  <path d="M200 306V342" class="ln"/><polygon points="80,347 340,347 320,403 60,403" class="p"/><text x="200" y="380" text-anchor="middle" class="t">Submit username + password</text>
  <path d="M200 403V438" class="ln"/><polygon points="200,443 330,493 200,543 70,493" class="d"/><text x="200" y="488" text-anchor="middle" class="t"><tspan x="200">Hash matches and</tspan><tspan x="200" dy="19">not locked?</tspan></text>
  <path d="M70 493H20V375H65" class="ln"/><text x="25" y="482" class="lbl">No: error/cooldown</text>
  <path d="M330 493H435" class="ln"/><text x="370" y="482" class="lbl">Yes</text><rect x="440" y="465" width="245" height="56" rx="5" class="p"/><text x="563" y="498" text-anchor="middle" class="t">Write local session</text><path d="M563 465V185" class="ln"/>
  <path d="M340 278H760" class="ln"/><text x="520" y="266" class="lbl">Forgot password</text><polygon points="760,250 960,250 940,306 740,306" class="p"/><text x="850" y="283" text-anchor="middle" class="t">Enter username</text>
  <path d="M850 306V342" class="ln"/><rect x="735" y="347" width="230" height="56" rx="5" class="p"/><text x="850" y="380" text-anchor="middle" class="t">Show stored question</text>
  <path d="M850 403V438" class="ln"/><polygon points="850,443 970,493 850,543 730,493" class="d"/><text x="850" y="488" text-anchor="middle" class="t"><tspan x="850">Answer hash</tspan><tspan x="850" dy="19">matches?</tspan></text>
  <path d="M970 493H990V375H968" class="ln"/><text x="948" y="480" class="lbl">No</text><path d="M850 543V582" class="ln"/><text x="862" y="568" class="lbl">Yes</text><polygon points="740,587 960,587 940,643 720,643" class="p"/><text x="840" y="620" text-anchor="middle" class="t">Enter new password</text>
  <path d="M840 643V680" class="ln"/><rect x="695" y="685" width="290" height="60" rx="5" class="bad"/><text x="840" y="710" text-anchor="middle" class="t"><tspan x="840">Reset by username;</tspan><tspan x="840" dy="19">no proof token parameter</tspan></text>
  <polygon points="370,685 600,685 580,745 350,745" class="bad"/><text x="475" y="710" text-anchor="middle" class="t"><tspan x="475">Direct function call can</tspan><tspan x="475" dy="19">reach the same reset</tspan></text><path d="M600 715H690" class="ln"/>
  <path d="M840 745V780" class="ln"/><path d="M720 792 C720 774 960 774 960 792 V842 C960 860 720 860 720 842 Z" class="db"/><ellipse cx="840" cy="792" rx="120" ry="18" class="db"/><text x="840" y="825" text-anchor="middle" class="t">Replace local password hash</text>
</svg>
