<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#496175"/></marker>
    <style>.t{font:16px 'Segoe UI',Arial;fill:#172033}.s{font:14px 'Segoe UI',Arial;fill:#425466}.p{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.d{fill:#fff8df;stroke:#c58b0b;stroke-width:2}.db{fill:#edf7ef;stroke:#1d7a46;stroke-width:2}.term{fill:#0b3654;stroke:#0b3654;stroke-width:2}.tw{font:16px 'Segoe UI',Arial;fill:white;font-weight:700}.ln{stroke:#496175;stroke-width:2;fill:none;marker-end:url(#a)}.lbl{font:13px 'Segoe UI',Arial;fill:#5b6475;font-weight:700}</style>
  </defs>
  <rect x="330" y="20" width="240" height="54" rx="27" class="term"/><text x="450" y="54" text-anchor="middle" class="tw">Open HRIS</text>
  <path d="M450 74V105" class="ln"/>
  <rect x="315" y="110" width="270" height="58" rx="5" class="p"/><text x="450" y="145" text-anchor="middle" class="t">Seed missing demo keys</text>
  <path d="M450 168V205" class="ln"/>
  <path d="M315 216 C315 198 585 198 585 216 V268 C585 286 315 286 315 268 Z" class="db"/><ellipse cx="450" cy="216" rx="135" ry="18" class="db"/><text x="450" y="249" text-anchor="middle" class="t">Browser localStorage</text>
  <path d="M450 286V320" class="ln"/>
  <polygon points="300,330 600,330 570,388 270,388" class="p"/><text x="435" y="365" text-anchor="middle" class="t">Enter username and password</text>
