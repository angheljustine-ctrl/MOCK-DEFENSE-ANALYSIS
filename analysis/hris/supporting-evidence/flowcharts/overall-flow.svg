  <rect x="300" y="425" width="270" height="58" rx="5" class="p"/><text x="435" y="449" text-anchor="middle" class="t"><tspan x="435">Hash password; find</tspan><tspan x="435" dy="20">local user</tspan></text>
  <path d="M435 483V512" class="ln"/>
  <polygon points="435,520 565,575 435,630 305,575" class="d"/><text x="435" y="571" text-anchor="middle" class="t"><tspan x="435">Credentials</tspan><tspan x="435" dy="20">valid?</tspan></text>
  <path d="M305 575H165V348H275" class="ln"/><text x="220" y="564" class="lbl">No: error / cooldown</text>
