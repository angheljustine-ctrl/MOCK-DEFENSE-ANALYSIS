  <rect x="300" y="665" width="270" height="54" rx="5" class="p"/><text x="435" y="698" text-anchor="middle" class="t">Write local session</text>
  <path d="M570 692H685V235H590" class="ln"/><text x="695" y="470" class="lbl" transform="rotate(90 695 470)">All modules read/write same store</text>
  <path d="M435 719V750" class="ln"/>
  <rect x="260" y="755" width="350" height="58" rx="5" class="p"/><text x="435" y="779" text-anchor="middle" class="t"><tspan x="435">Render layout + employee, attendance,</tspan><tspan x="435" dy="20">payroll, reports, or settings module</tspan></text>
  <path d="M610 784H690" class="ln"/><rect x="695" y="755" width="170" height="58" rx="29" class="term"/><text x="780" y="779" text-anchor="middle" class="tw"><tspan x="780">Continue or</tspan><tspan x="780" dy="20">log out</tspan></text>
