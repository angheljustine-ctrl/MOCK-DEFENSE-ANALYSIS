  <path d="M805 420V452" class="ln"/><text x="817" y="442" class="lbl">Yes</text><rect x="650" y="452" width="310" height="56" rx="5" class="bad"/><text x="805" y="476" text-anchor="middle" class="t"><tspan x="805">Insert record without</tspan><tspan x="805" dy="19">duplicate check</tspan></text>
  <path d="M290 508V620H500" class="ln"/><path d="M190 586V620H500" class="ln"/><path d="M805 508V620H500" class="ln"/>
  <path d="M380 632 C380 614 620 614 620 632 V682 C620 700 380 700 380 682 Z" class="db"/><ellipse cx="500" cy="632" rx="120" ry="18" class="db"/><text x="500" y="664" text-anchor="middle" class="t">attendance localStorage</text>
  <path d="M500 700V730" class="ln"/><rect x="330" y="735" width="340" height="56" rx="5" class="bad"/><text x="500" y="759" text-anchor="middle" class="t"><tspan x="500">daysPresent = count(records</tspan><tspan x="500" dy="19">where timeIn exists)</tspan></text>
  <path d="M500 791V820" class="ln"/><rect x="320" y="825" width="360" height="56" rx="5" class="bad"/><text x="500" y="858" text-anchor="middle" class="t">Basic pay = rate × daysPresent</text>
