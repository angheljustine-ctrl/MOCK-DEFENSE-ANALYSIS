  <path d="M630 150H810V220" class="ln"/><text x="735" y="140" class="lbl">Manual</text><polygon points="710,225 920,225 900,285 690,285" class="p"/><text x="805" y="250" text-anchor="middle" class="t"><tspan x="805">Employee, date, time-in,</tspan><tspan x="805" dy="19">optional time-out</tspan></text>
  <path d="M190 275V315" class="ln"/><polygon points="190,320 325,370 190,420 55,370" class="d"/><text x="190" y="365" text-anchor="middle" class="t"><tspan x="190">Existing employee/date</tspan><tspan x="190" dy="19">record?</tspan></text>
  <path d="M805 285V315" class="ln"/><polygon points="805,320 940,370 805,420 670,370" class="d"/><text x="805" y="365" text-anchor="middle" class="t"><tspan x="805">Required fields and</tspan><tspan x="805" dy="19">time order valid?</tspan></text>
  <path d="M55 370H20V480H170" class="ln"/><text x="24" y="360" class="lbl">No</text><rect x="175" y="452" width="230" height="56" rx="5" class="p"/><text x="290" y="485" text-anchor="middle" class="t">Insert time-in</text>
