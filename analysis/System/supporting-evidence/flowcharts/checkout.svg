on points="530,198 625,230 530,262 435,230" class="node "/><text x="530" y="221.5" text-anchor="middle" dominant-baseline="middle">Stock still</text><text x="530" y="238.5" text-anchor="middle" dominant-baseline="middle">enough?</text><polygon points="300,198 395,230 300,262 205,230" class="node "/><text x="300" y="230" text-anchor="middle" dominant-baseline="middle">Payment enough?</text><polygon points="15,198 185,198 165,262 -5,262" class="node "/><text x="90" y="230" text-anchor="middle" dominant-baseline="middle">Show error</text><rect x="190" y="378" width="220" height="64" rx="8" class="node "/><text x="300" y="410" text-anchor="middle" dominant-baseline="middle">Create invoice + sale</text><rect x="465" y="378" width="190" height="64" rx="8" class="node "/><text x="560" y="410" text-anchor="middle" dominant-baseline="middle">Reduce stock</text><path d="M700,388 Q820,368 940,388 L940,432 Q820,452 700,432 Z" class="node "/><text x="820" y="410" text-anchor="middle" dominant-baseline="middle">Save products + sales</text><polygon points="985,378 1155,378 1135,442 965,442" class="node "/><text x="1060" y="410" text-anchor="middle" dominant-baseline="middle">Show receipt</text><rect x="980" y="568" width="160" height="64" rx="32" class="node "/><text x="1060" y="600" text-anchor="middle" dominant-baseline="middle">Complete</text></svg>