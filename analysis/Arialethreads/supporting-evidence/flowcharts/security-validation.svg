<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#294861"/></marker></defs>
  <style>.t{font:17px Arial;fill:#17283f}.s{fill:#eef7fb;stroke:#125e8a;stroke-width:3}.d{fill:#fff6db;stroke:#b37a00;stroke-width:3}.e{fill:#fff0f0;stroke:#a61b1b;stroke-width:3}.l{stroke:#294861;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#a61b1b;stroke-width:3;fill:none;marker-end:url(#a)}.b{font:15px Arial;fill:#4b5968;font-weight:bold}</style>
  <rect x="455" y="20" width="190" height="54" rx="27" class="s"/><text x="550" y="53" text-anchor="middle" class="t">Page load</text>
  <path d="M440 105 C440 90 660 90 660 105 L660 165 C660 180 440 180 440 165 Z M440 105 C440 120 660 120 660 105" class="s"/><text x="550" y="135" text-anchor="middle" class="t"><tspan x="550">Read browser</tspan><tspan x="550" dy="22">localStorage</tspan></text>
  <polygon points="550,210 680,265 550,320 420,265" class="d"/><text x="550" y="260" text-anchor="middle" class="t"><tspan x="550">Stored users</tspan><tspan x="550" dy="21">empty?</tspan></text>
  <rect x="90" y="235" width="260" height="64" class="s"/><text x="220" y="260" text-anchor="middle" class="t"><tspan x="220">Seed plaintext</tspan><tspan x="220" dy="22">demo accounts</tspan></text>
  <rect x="750" y="235" width="260" height="64" class="e"/><text x="880" y="260" text-anchor="middle" class="t"><tspan x="880">Trust stored users</tspan><tspan x="880" dy="22">as-is</tspan></text>
  <polygon points="400,365 700,365 680,430 380,430" class="s"/><text x="540" y="394" text-anchor="middle" class="t"><tspan x="540">Enter credentials and compare</tspan><tspan x="540" dy="22">plaintext values</tspan></text>
  <polygon points="550,470 680,525 550,580 420,525" class="d"/><text x="550" y="520" text-anchor="middle" class="t"><tspan x="550">Exact match</tspan><tspan x="550" dy="21">found?</tspan></text>
  <rect x="90" y="495" width="250" height="60" class="e"/><text x="215" y="530" text-anchor="middle" class="t">Show generic error</text>
  <rect x="420" y="620" width="260" height="65" class="s"/><text x="550" y="647" text-anchor="middle" class="t"><tspan x="550">Set currentUser and</tspan><tspan x="550" dy="22">hide menus by role</tspan></text>
  <rect x="780" y="610" width="270" height="85" rx="40" class="e"/><text x="915" y="640" text-anchor="middle" class="t"><tspan x="915">No server, database,</tspan><tspan x="915" dy="22">or trusted authorization</tspan></text>
  <polygon points="45,95 315,95 295,165 25,165" class="e"/><text x="170" y="124" text-anchor="middle" class="t"><tspan x="170">Storage or page script</tspan><tspan x="170" dy="22">is modified locally</tspan></text>
  <line x1="550" y1="74" x2="550" y2="92" class="l"/><line x1="550" y1="180" x2="550" y2="210" class="l"/>
  <line x1="420" y1="265" x2="350" y2="265" class="l"/><text x="375" y="250" class="b">Yes</text><line x1="680" y1="265" x2="750" y2="265" class="l"/><text x="705" y="250" class="b">No</text>
  <path d="M220 299 L220 397 L380 397" class="l"/><path d="M880 299 L880 397 L700 397" class="l"/><line x1="550" y1="430" x2="550" y2="470" class="l"/>
  <line x1="420" y1="525" x2="340" y2="525" class="l"/><text x="370" y="510" class="b">No</text><path d="M215 495 L215 397 L380 397" class="l"/>
  <line x1="550" y1="580" x2="550" y2="620" class="l"/><text x="565" y="605" class="b">Yes</text><line x1="680" y1="652" x2="780" y2="652" class="r"/>
  <path d="M315 130 L440 130" class="r"/>
