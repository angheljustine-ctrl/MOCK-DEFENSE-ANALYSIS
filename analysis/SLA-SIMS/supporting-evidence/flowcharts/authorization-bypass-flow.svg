<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31546f"/></marker><style>.n{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.d{fill:#fff7dd;stroke:#9a6b00;stroke-width:2}.s{fill:#e9f7ef;stroke:#1d7a46;stroke-width:2}.bad{fill:#fdecec;stroke:#a61b1b;stroke-width:2}.db{fill:#f4ecfb;stroke:#6d3a91;stroke-width:2}.t{font:16px 'Segoe UI',Arial;fill:#172033;text-anchor:middle}.sm{font:14px 'Segoe UI',Arial;fill:#172033;text-anchor:middle}.ln{stroke:#31546f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="s" x="35" y="35" width="130" height="46" rx="23"/><text class="t" x="100" y="64">Start</text>
  <path class="ln" d="M165 58 H225"/><path class="n" d="M245 30 H405 L385 86 H225 Z"/><text class="t" x="315" y="64">Teacher logs in</text>
  <path class="ln" d="M405 58 H465"/><rect class="n" x="465" y="30" width="220" height="56"/><text class="sm" x="575" y="54">Store teacher object</text><text class="sm" x="575" y="73">in localStorage</text>
  <path class="ln" d="M685 58 H745"/><rect class="n" x="745" y="30" width="300" height="56"/><text class="sm" x="895" y="54">Hide Reports and Voucher</text><text class="sm" x="895" y="73">menu items</text>
  <path class="ln" d="M895 86 V145"/><polygon class="d" points="895,145 995,185 895,225 795,185"/><text class="sm" x="895" y="181">Visible menu</text><text class="sm" x="895" y="200">only?</text>
  <path class="ln" d="M795 185 H620"/><text class="sm" x="710" y="173">Yes</text><path class="n" d="M365 155 H620 L600 215 H345 Z"/><text class="sm" x="483" y="181">Expected teacher modules:</text><text class="sm" x="483" y="200">dashboard, students, attendance, grades</text>
  <path class="ln" d="M895 225 V275"/><text class="sm" x="936" y="252">No: direct URL</text><path class="n" d="M760 275 H1050 L1030 335 H740 Z"/><text class="sm" x="895" y="301">Open reports.html or</text><text class="sm" x="895" y="320">voucher.html?studentId=101</text>
  <path class="ln" d="M740 305 H655"/><polygon class="d" points="565,265 655,305 565,345 475,305"/><text class="sm" x="565" y="301">Any session</text><text class="sm" x="565" y="320">object?</text>
  <path class="ln" d="M565 265 V230 H430"/><text class="sm" x="540" y="249">No</text><path class="n" d="M235 205 H430 L410 255 H215 Z"/><text class="sm" x="323" y="235">Redirect to login</text>
  <path class="ln" d="M565 345 V390"/><text class="sm" x="592" y="370">Yes</text><rect class="bad" x="430" y="390" width="270" height="65"/><text class="sm" x="565" y="417">Page loads: no page-level</text><text class="sm" x="565" y="438">role rejection</text>
  <path class="ln" d="M700 422 H760"/><path class="bad" d="M780 390 H1045 L1025 455 H760 Z"/><text class="sm" x="902" y="417">Payment and status controls</text><text class="sm" x="902" y="438">remain enabled</text>
  <path class="ln" d="M902 455 V495"/><polygon class="d" points="902,495 987,535 902,575 817,535"/><text class="sm" x="902" y="531">Submit</text><text class="sm" x="902" y="550">mutation?</text>
  <path class="ln" d="M817 535 H680"/><text class="sm" x="752" y="523">No</text><rect class="s" x="505" y="512" width="175" height="46" rx="23"/><text class="sm" x="592" y="541">Safe check ends</text>
  <path class="ln" d="M987 535 H1035"/><text class="sm" x="1010" y="523">Yes</text><path class="db" d="M1015 495 C1015 482 1090 482 1090 495 V565 C1090 578 1015 578 1015 565 Z"/><text class="sm" x="1052" y="526">Data</text><text class="sm" x="1052" y="545">changes</text>
</svg>
