<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#31546f"/></marker><style>.n{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.d{fill:#fff7dd;stroke:#9a6b00;stroke-width:2}.s{fill:#e9f7ef;stroke:#1d7a46;stroke-width:2}.db{fill:#f4ecfb;stroke:#6d3a91;stroke-width:2}.t{font:16px 'Segoe UI',Arial;fill:#172033;text-anchor:middle}.sm{font:14px 'Segoe UI',Arial;fill:#172033;text-anchor:middle}.ln{stroke:#31546f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="s" x="40" y="35" width="150" height="50" rx="25"/><text class="t" x="115" y="66">Start</text>
  <path class="ln" d="M190 60 H260"/><polygon class="d" points="350,25 440,60 350,95 260,60"/><text class="sm" x="350" y="55">Session in</text><text class="sm" x="350" y="74">localStorage?</text>
  <path class="ln" d="M440 60 H510"/><text class="sm" x="475" y="48">Yes</text><rect class="n" x="510" y="35" width="170" height="50"/><text class="t" x="595" y="66">Load requested page</text>
  <path class="ln" d="M350 95 V145"/><text class="sm" x="372" y="122">No</text><path class="n" d="M285 145 H415 L395 200 H265 Z"/><text class="t" x="340" y="178">Show login</text>
  <path class="ln" d="M340 200 V240"/><rect class="n" x="235" y="240" width="210" height="65"/><text class="sm" x="340" y="267">Compare email + plaintext</text><text class="sm" x="340" y="287">password with local users</text>
  <path class="ln" d="M445 272 H515"/><polygon class="d" points="595,237 675,272 595,307 515,272"/><text class="t" x="595" y="278">Match?</text>
  <path class="ln" d="M675 272 H755"/><text class="sm" x="714" y="260">Yes</text><rect class="n" x="755" y="240" width="240" height="65"/><text class="sm" x="875" y="267">Save full user object</text><text class="sm" x="875" y="287">as browser session</text>
  <path class="ln" d="M595 307 V360 H340 V305"/><text class="sm" x="620" y="342">No: warning / lock</text>
  <path class="ln" d="M875 240 V110 H680"/><rect class="n" x="510" y="125" width="170" height="55"/><text class="sm" x="595" y="149">Hide navigation</text><text class="sm" x="595" y="168">and forms by role</text>
  <path class="ln" d="M595 180 V220"/><path class="n" d="M525 220 H685 L665 270 H505 Z"/><text class="sm" x="595" y="250">View or edit module</text>
  <path class="ln" d="M595 270 V335"/><polygon class="d" points="595,335 685,375 595,415 505,375"/><text class="t" x="595" y="381">Write action?</text>
  <path class="ln" d="M505 375 H390"/><text class="sm" x="450" y="363">No</text><path class="db" d="M220 345 C220 330 390 330 390 345 V405 C390 420 220 420 220 405 Z"/><ellipse class="db" cx="305" cy="345" rx="85" ry="15"/><text class="sm" x="305" y="380">Read localStorage</text>
  <path class="ln" d="M685 375 H800"/><text class="sm" x="740" y="363">Yes</text><path class="db" d="M800 345 C800 330 990 330 990 345 V405 C990 420 800 420 800 405 Z"/><ellipse class="db" cx="895" cy="345" rx="95" ry="15"/><text class="sm" x="895" y="380">Overwrite localStorage</text>
  <path class="ln" d="M305 420 V485 H500"/><path class="ln" d="M895 420 V485 H690"/><path class="n" d="M500 460 H710 L690 515 H480 Z"/><text class="sm" x="595" y="486">Render dashboard, table,</text><text class="sm" x="595" y="505">receipt, or report</text>
  <path class="ln" d="M595 515 V555"/><rect class="s" x="520" y="555" width="150" height="45" rx="23"/><text class="t" x="595" y="584">End</text>
</svg>
