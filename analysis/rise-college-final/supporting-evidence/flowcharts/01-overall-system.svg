<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#31536b"/></marker></defs>
  <style>.t{font:600 20px 'Segoe UI',Arial;fill:#173247}.s{font:16px 'Segoe UI',Arial;fill:#31536b}.p{fill:#eef7fb;stroke:#2477a6;stroke-width:3}.d{fill:#fff7dd;stroke:#b17a00;stroke-width:3}.db{fill:#edf8f1;stroke:#257548;stroke-width:3}.e{fill:#e9f0ff;stroke:#315c9c;stroke-width:3}.l{stroke:#31536b;stroke-width:3;fill:none;marker-end:url(#a)}.lab{font:700 14px 'Segoe UI',Arial;fill:#7b5600}</style>
  <rect x="455" y="20" rx="34" ry="34" width="290" height="62" class="e"/><text x="600" y="58" text-anchor="middle" class="t">Open public site</text>
  <path d="M600 82 V125" class="l"/><polygon points="600,125 730,185 600,245 470,185" class="d"/><text x="600" y="178" text-anchor="middle" class="t">Choose action</text><text x="600" y="202" text-anchor="middle" class="s">browse, request, portal</text>
  <path d="M470 185 H275" class="l"/><text x="350" y="170" class="lab">Browse</text><rect x="35" y="145" rx="12" width="240" height="80" class="p"/><text x="155" y="178" text-anchor="middle" class="t">Public pages</text><text x="155" y="204" text-anchor="middle" class="s">Static content</text>
  <path d="M600 245 V300" class="l"/><text x="615" y="280" class="lab">Contact / order</text><polygon points="420,300 780,300 755,380 395,380" class="p"/><text x="588" y="333" text-anchor="middle" class="t">Enter request details</text><text x="588" y="360" text-anchor="middle" class="s">Client validation only</text>
  <path d="M588 380 V435" class="l"/><rect x="395" y="435" rx="12" width="385" height="78" class="p"/><text x="588" y="468" text-anchor="middle" class="t">Show "prepared" message</text><text x="588" y="493" text-anchor="middle" class="s">No send or persistence</text>
  <path d="M730 185 H910" class="l"/><text x="790" y="170" class="lab">Portal</text><polygon points="980,125 1145,185 980,245 815,185" class="d"/><text x="980" y="178" text-anchor="middle" class="t">Local session?</text><text x="980" y="202" text-anchor="middle" class="s">Browser storage</text>
  <path d="M980 245 V300" class="l"/><text x="995" y="276" class="lab">No</text><polygon points="835,300 1145,300 1120,380 810,380" class="p"/><text x="978" y="333" text-anchor="middle" class="t">Sign in or register</text><text x="978" y="358" text-anchor="middle" class="s">Defaults are seeded in code</text>
  <path d="M978 380 V435" class="l"/><path d="M835 450 C835 430 1120 430 1120 450 V505 C1120 525 835 525 835 505 Z" class="db"/><ellipse cx="977" cy="450" rx="142" ry="20" class="db"/><text x="977" y="480" text-anchor="middle" class="t">localStorage</text><text x="977" y="504" text-anchor="middle" class="s">users, session, SIS data</text>
  <path d="M815 185 H770 V555 H835" class="l"/><text x="780" y="535" class="lab">Yes</text><path d="M977 525 V555" class="l"/><rect x="835" y="555" rx="12" width="285" height="75" class="p"/><text x="977" y="586" text-anchor="middle" class="t">Route by role</text><text x="977" y="611" text-anchor="middle" class="s">Mostly hardcoded dashboards</text>
</svg>
