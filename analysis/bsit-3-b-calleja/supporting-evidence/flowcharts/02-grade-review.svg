<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315b78"/></marker>
    <style>
      .bg{fill:#f7fafc}.node{fill:#fff;stroke:#315b78;stroke-width:3}.decision{fill:#fff8df;stroke:#b7791f;stroke-width:3}.risk{fill:#fff1f1;stroke:#b83232;stroke-width:3}.store{fill:#edf8f4;stroke:#25745a;stroke-width:3}.line{fill:none;stroke:#315b78;stroke-width:3;marker-end:url(#arrow)}.riskline{fill:none;stroke:#b83232;stroke-width:4;marker-end:url(#arrow)}.label{font:600 19px Arial,sans-serif;fill:#183247;text-anchor:middle}.small{font:600 15px Arial,sans-serif;fill:#475569;text-anchor:middle}.branch{font:700 15px Arial,sans-serif;fill:#315b78}.title{font:700 30px Arial,sans-serif;fill:#12344d}.subtitle{font:18px Arial,sans-serif;fill:#516173}.note{font:700 16px Arial,sans-serif;fill:#a61b1b;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="900" rx="20"/>
  <text class="title" x="45" y="50">Main transaction: class-record review</text>
  <text class="subtitle" x="45" y="82">The queue works only through shared browser storage; the red path is the confirmed missing completeness gate.</text>
  <rect class="node" x="480" y="105" width="240" height="58" rx="29"/><text class="label" x="600" y="141">Teacher starts</text>
  <polygon class="node" points="410,195 790,195 760,255 380,255"/><text class="label" x="585" y="224">Select section and period</text><text class="small" x="585" y="245">Enter scores and remarks</text>
  <polygon class="decision" points="600,300 750,370 600,440 450,370"/><text class="label" x="600" y="365">Draft or</text><text class="label" x="600" y="390">submit?</text>
  <path class="store" d="M85 340 Q215 310 345 340 L345 385 Q215 415 85 385 Z"/><ellipse class="store" cx="215" cy="340" rx="130" ry="30"/><text class="label" x="215" y="357">nt_class_records</text>
  <polygon class="risk" points="600,485 775,555 600,625 425,555"/><text class="label" x="600" y="546">Complete grades</text><text class="small" x="600" y="570">for every student?</text><text class="note" x="600" y="604">Actual: no check</text>
  <rect class="risk" x="420" y="665" width="360" height="76" rx="12"/><text class="label" x="600" y="695">Build snapshot even if</text><text class="small" x="600" y="720">all score cells are blank</text>
  <path class="store" d="M420 790 Q600 755 780 790 L780 835 Q600 870 420 835 Z"/><ellipse class="store" cx="600" cy="790" rx="180" ry="35"/><text class="label" x="600" y="807">nt_record_submissions</text>
  <rect class="node" x="850" y="735" width="290" height="80" rx="12"/><text class="label" x="995" y="766">Admin reads queue</text><text class="small" x="995" y="792">Approve or return</text>
  <rect class="node" x="850" y="565" width="290" height="82" rx="12"/><text class="label" x="995" y="597">Write decision back</text><text class="small" x="995" y="623">Teacher syncs next view</text>
  <rect class="risk" x="40" y="705" width="300" height="120" rx="12"/><text class="label" x="190" y="742">Cross-browser limit</text><text class="small" x="190" y="770">Another device or browser</text><text class="small" x="190" y="793">has a different localStorage</text>
  <path class="line" d="M600 163 L600 195"/><path class="line" d="M600 255 L600 300"/>
  <path class="line" d="M450 370 L345 360"/><text class="branch" x="375" y="348">Draft</text>
  <path class="riskline" d="M600 440 L600 485"/><text class="branch" x="620" y="468">Submit</text>
  <path class="riskline" d="M600 625 L600 665"/><path class="riskline" d="M600 741 L600 755"/>
  <path class="line" d="M780 805 L850 780"/><path class="line" d="M995 735 L995 647"/><path class="line" d="M850 606 C770 606 760 740 700 770"/>
  <path class="riskline" d="M420 805 L340 770"/>
</svg>
