<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315b78"/></marker>
    <style>
      .bg{fill:#f7fafc}.node{fill:#fff;stroke:#315b78;stroke-width:3}.decision{fill:#fff8df;stroke:#b7791f;stroke-width:3}.risk{fill:#fff1f1;stroke:#b83232;stroke-width:3}.store{fill:#edf8f4;stroke:#25745a;stroke-width:3}.line{fill:none;stroke:#315b78;stroke-width:3;marker-end:url(#arrow)}.label{font:600 20px Arial,sans-serif;fill:#183247;text-anchor:middle}.small{font:600 16px Arial,sans-serif;fill:#475569;text-anchor:middle}.branch{font:700 16px Arial,sans-serif;fill:#315b78}.title{font:700 30px Arial,sans-serif;fill:#12344d}.subtitle{font:18px Arial,sans-serif;fill:#516173}
    </style>
  </defs>
  <rect class="bg" width="1200" height="920" rx="20"/>
  <text class="title" x="45" y="50">Actual overall system flow</text>
  <text class="subtitle" x="45" y="82">All accounts, sessions, academic records, and review decisions stay in one browser's localStorage.</text>
  <rect class="node" x="500" y="105" width="200" height="58" rx="29"/><text class="label" x="600" y="141">Start</text>
  <polygon class="node" points="430,195 770,195 740,255 400,255"/><text class="label" x="585" y="224">Enter username</text><text class="small" x="585" y="245">and password</text>
  <rect class="node" x="390" y="295" width="420" height="70" rx="12"/><text class="label" x="600" y="326">Read admin and teacher lists</text><text class="small" x="600" y="350">from browser localStorage</text>
  <polygon class="decision" points="600,400 740,470 600,540 460,470"/><text class="label" x="600" y="465">Account</text><text class="label" x="600" y="490">found?</text>
  <polygon class="risk" points="130,410 390,410 365,470 105,470"/><text class="label" x="248" y="446">Show account error</text>
  <polygon class="decision" points="600,575 770,650 600,725 430,650"/><text class="label" x="600" y="641">Password matches</text><text class="small" x="600" y="666">and status is active?</text>
  <polygon class="risk" points="90,590 390,590 365,650 65,650"/><text class="label" x="228" y="626">Show password or</text><text class="small" x="228" y="648">inactive-account error</text>
  <polygon class="decision" points="600,755 690,800 600,845 510,800"/><text class="label" x="600" y="807">Role?</text>
  <rect class="node" x="200" y="765" width="220" height="70" rx="12"/><text class="label" x="310" y="796">Admin dashboard</text><text class="small" x="310" y="821">Manage and review</text>
  <rect class="node" x="780" y="765" width="220" height="70" rx="12"/><text class="label" x="890" y="796">Teacher dashboard</text><text class="small" x="890" y="821">Record and submit</text>
  <path class="store" d="M470 865 Q600 835 730 865 L730 895 Q600 925 470 895 Z"/><ellipse class="store" cx="600" cy="865" rx="130" ry="30"/><text class="label" x="600" y="883">localStorage</text>
  <path class="line" d="M600 163 L600 195"/><path class="line" d="M600 255 L600 295"/><path class="line" d="M600 365 L600 400"/>
  <path class="line" d="M460 470 L390 440"/><text class="branch" x="402" y="443">No</text><path class="line" d="M130 410 C110 260 250 225 400 225"/>
  <path class="line" d="M600 540 L600 575"/><text class="branch" x="615" y="563">Yes</text>
  <path class="line" d="M430 650 L390 620"/><text class="branch" x="398" y="622">No</text><path class="line" d="M90 590 C50 340 220 225 400 225"/>
  <path class="line" d="M600 725 L600 755"/><text class="branch" x="615" y="746">Yes</text>
  <path class="line" d="M510 800 L420 800"/><text class="branch" x="440" y="785">Admin</text><path class="line" d="M690 800 L780 800"/><text class="branch" x="710" y="785">Teacher</text>
  <path class="line" d="M310 835 C330 880 400 880 470 880"/><path class="line" d="M890 835 C870 880 800 880 730 880"/>
</svg>
