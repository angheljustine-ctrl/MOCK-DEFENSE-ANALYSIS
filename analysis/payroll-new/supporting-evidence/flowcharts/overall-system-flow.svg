<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36556f"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033;font-size:18px}.small{font-size:15px}.box{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.store{fill:#fff8df;stroke:#9a6b00;stroke-width:2}.risk{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.line{stroke:#36556f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect x="30" y="40" rx="28" width="160" height="58" class="box"/><text x="110" y="75" text-anchor="middle">Start: user</text>
  <polygon points="230,40 420,40 400,98 210,98" class="box"/><text x="315" y="67" text-anchor="middle">Browser input</text><text x="315" y="88" text-anchor="middle" class="small">Admin / HR / Employee</text>
  <rect x="470" y="40" width="220" height="58" class="box"/><text x="580" y="67" text-anchor="middle">HTML + JavaScript</text><text x="580" y="88" text-anchor="middle" class="small">auth and business rules</text>
  <polygon points="790,30 900,69 790,108 680,69" class="box"/><text x="790" y="64" text-anchor="middle">Role check</text><text x="790" y="85" text-anchor="middle" class="small">passes?</text>
  <polygon points="500,180 660,180 645,255 515,255" class="box"/><text x="580" y="214" text-anchor="middle">Run module</text><text x="580" y="236" text-anchor="middle" class="small">payroll / attendance</text>
  <ellipse cx="790" cy="190" rx="115" ry="22" class="store"/><rect x="675" y="190" width="230" height="60" class="store"/><ellipse cx="790" cy="250" rx="115" ry="22" class="store"/><text x="790" y="213" text-anchor="middle">Browser localStorage</text><text x="790" y="236" text-anchor="middle" class="small">authoritative data</text>
  <polygon points="790,300 900,340 790,380 680,340" class="box"/><text x="790" y="336" text-anchor="middle">MQTT connected?</text>
  <rect x="420" y="410" width="235" height="58" class="risk"/><text x="538" y="436" text-anchor="middle">Public broker/topic</text><text x="538" y="457" text-anchor="middle" class="small">whole key/value payload</text>
  <rect x="750" y="410" width="250" height="58" class="risk"/><text x="875" y="436" text-anchor="middle">Other client accepts</text><text x="875" y="457" text-anchor="middle" class="small">and replaces local data</text>
  <rect x="920" y="40" rx="20" width="150" height="58" class="box"/><text x="995" y="75" text-anchor="middle">Redirect</text>
  <path d="M190 69 L210 69" class="line"/><path d="M420 69 L470 69" class="line"/><path d="M690 69 L680 69" class="line"/><path d="M790 108 L790 150 L580 150 L580 180" class="line"/><text x="690" y="143" class="small">Yes</text><path d="M900 69 L920 69" class="line"/><text x="908" y="58" class="small">No</text><path d="M660 218 L675 218" class="line"/><path d="M790 272 L790 300" class="line"/><path d="M680 340 L538 340 L538 410" class="line"/><text x="600" y="330" class="small">Yes: publish</text><path d="M655 439 L750 439" class="line"/><path d="M875 410 L875 390 L940 390 L940 218 L905 218" class="line"/><text x="805" y="326" class="small">No: local only</text>
