<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#36556f"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033;font-size:17px}.small{font-size:14px}.box{fill:#eef7fb;stroke:#125e8a;stroke-width:2}.store{fill:#fff8df;stroke:#9a6b00;stroke-width:2}.risk{fill:#fff0f0;stroke:#a61b1b;stroke-width:2}.ok{fill:#effaf3;stroke:#1d7a46;stroke-width:2}.line{stroke:#36556f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
