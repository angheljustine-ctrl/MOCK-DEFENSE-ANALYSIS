"649.5" font-family="Arial" font-size="14" fill="#314d61">Yes</text><polyline points="290,727.0 290,738.0" fill="none" stroke="#45637a" stroke-width="2" marker-end="url(#arrow)"/><rect x="175.0" y="8.0" width="230" height="54" rx="27.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Start checkout</text><polygon points="190.0,83.0 405.0,83.0 390.0,137.0 175.0,137.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="115" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Cart and cash amount</text><rect x="175.0" y="158.0" width="230" height="54" rx="3" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="181" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Reload products</text><text x="290" y="199" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">validate / clamp cart</text><polygon points="290,238.0 405.0,265 290,292.0 175.0,265" fill="#fff1df" stroke="#185d88" stroke-width="1.8"/><text x="290" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Stock / payment OK?</text><polygon points="550.0,238.0 765.0,238.0 750.0,292.0 535.0,292.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="650" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Show error / stop</text><polygon points="290,323.0 405.0,350 290,377.0 175.0,350" fill="#fff1df" stroke="#185d88" stroke-width="1.8"/><text x="290" y="355" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Confirm sale?</text><rect x="535.0" y="323.0" width="230" height="54" rx="27.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="650" y="355" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Cancel - no deduction</text><rect x="175.0" y="408.0" width="230" height="54" rx="3" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="431" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Deduct stock in memory</text><text x="290" y="449" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">build sale + movements</text><path d="M175.0 495.0 A115.0 10 0 0 1 405.0 495.0 L405.0 555.0 A115.0 10 0 0 1 175.0 555.0 Z" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><ellipse cx="290" cy="495.0" rx="115.0" ry="10" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="521" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Save products, movements,</text><text x="290" y="539" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">then sale - separate writes</text><polygon points="290,588.0 405.0,615 290,642.0 175.0,615" fill="#fff1df" stroke="#185d88" stroke-width="1.8"/><text x="290" y="620" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">All writes succeed?</text><rect x="535.0" y="588.0" width="230" height="54" rx="27.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="650" y="611" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Uncaught exception</text><text x="650" y="629" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">partial state may remain</text><polygon points="190.0,673.0 405.0,673.0 390.0,727.0 175.0,727.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="705" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">Clear cart / show success</text><rect x="175.0" y="738.0" width="230" height="54" rx="27.0" fill="#edf5fa" stroke="#185d88" stroke-width="1.8"/><text x="290" y="770" text-anchor="middle" font-family="Arial" font-size="16" fill="#173c55">End</text></svg>