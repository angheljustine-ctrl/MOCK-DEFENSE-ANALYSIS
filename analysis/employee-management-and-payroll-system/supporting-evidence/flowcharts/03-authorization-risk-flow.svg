5" y="514" text-anchor="middle">No guard: render admin page</text><polygon points="430,610 570,646 430,682 290,646" class="decision"/><text x="430" y="646" text-anchor="middle">Server authorization check?</text><path d="M270,727 C270,711 590,711 590,727 V765 C590,781 270,781 270,765 Z M270,727 C270,743 590,743 590,727" class="db"/><text x="430" y="746" text-anchor="middle">None: localStorage is source of truth</text></svg>